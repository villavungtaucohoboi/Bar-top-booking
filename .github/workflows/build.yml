# Tự build lại web khi có bài viết mới hoặc sửa mã nguồn.
# Bài đăng từ "Khu viết bài" được commit vào content/blog/ → workflow này chạy → commit trang đã build → GitHub Pages cập nhật.
name: Build site
on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'public/**']
  workflow_dispatch:
  schedule:
    - cron: '5 17 * * *'   # 0h05 giờ Việt Nam: gỡ khuyến mãi hết hạn
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài công cụ nén code
        run: npm install --no-audit --no-fund
      - name: Build
        run: node src/build.mjs
      - name: Commit trang đã build
        run: |
          git config user.name "topchill-build"
          git config user.email "topchill-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Build tự động: cập nhật trang"
          git push
      - name: Báo Bing, Copilot, ChatGPT, DuckDuckGo (IndexNow)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          # đợi GitHub Pages đăng xong rồi mới báo
          sleep 100
          MSG="$(git log -1 --format=%B HEAD~1 2>/dev/null; git log -1 --format=%B HEAD)"
          if echo "$MSG" | grep -q '\[indexnow-all\]'; then
            node src/indexnow.mjs all
          else
            node src/indexnow.mjs $(git diff --name-only HEAD~1 HEAD | grep -E '\.html$' | head -150)
          fi
